[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rudrai"
version = "0.1.0"
description = "Offline-first security scanner for AI-agent instructions and tool configurations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "RudrAI Contributors" }]
keywords = ["security", "ai-agents", "mcp", "sast", "sarif"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
]
dependencies = ["pathspec>=0.12,<2", "tomli>=2,<3; python_version < '3.11'"]

[project.scripts]
rudrai = "rudrai.cli:main"

[project.urls]
Documentation = "https://github.com/sazalgupta25/rudrai"
Repository = "https://github.com/sazalgupta25/rudrai"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rudrai = ["py.typed"]

