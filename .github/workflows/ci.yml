name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install . build pipx
      - run: python -m unittest discover -s tests -v
      - run: python scripts/benchmark.py
      - run: python -m build --wheel
      - name: Install built wheel in pipx
        shell: bash
        run: python -m pipx install --backend pip dist/*.whl
      - run: python -m pipx runpip rudrai check
      - name: Smoke test installed console command
        run: python -c "import os, pathlib, subprocess; p = subprocess.check_output(['python', '-m', 'pipx', 'environment', '--value', 'PIPX_BIN_DIR'], text=True).strip(); subprocess.run([str(pathlib.Path(p) / ('rudrai.exe' if os.name == 'nt' else 'rudrai')), '--version'], check=True)"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: rudrai-distributions
          path: dist/*

